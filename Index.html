<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<title>H5GG</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"><meta name="color-scheme" content="light dark">

<style>
/* Modern iOS-Inspired Design System */
:root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* Light Theme Defaults */
    --bg-color: #f2f2f7;
    --panel-bg: #ffffff;
    --panel-bg-alpha: rgba(255, 255, 255, 0.85);
    --text-color: #1c1c1e;
    --text-muted: #8e8e93;
    --accent: #007aff;
    --danger: #ff3b30;
    --border-color: rgba(60, 60, 67, 0.15);
    --btn-bg: rgba(116, 116, 128, 0.08);
    --btn-active: rgba(116, 116, 128, 0.15);
    --input-bg: rgba(116, 116, 128, 0.08);
    --shadow: 0 8px 30px rgba(0,0,0,0.12);
}

/* Explicit Dark Theme Class */
:root.dark {
    --bg-color: #000000;
    --panel-bg: #1c1c1e;
    --panel-bg-alpha: rgba(28, 28, 30, 0.85);
    --text-color: #f2f2f7;
    --text-muted: #98989d;
    --accent: #0a84ff;
    --danger: #ff453a;
    --border-color: rgba(84, 84, 88, 0.65);
    --btn-bg: rgba(118, 118, 128, 0.24);
    --btn-active: rgba(118, 118, 128, 0.35);
    --input-bg: rgba(118, 118, 128, 0.24);
    --shadow: 0 8px 30px rgba(0,0,0,0.5);
}

/* OS Dark Theme Fallback (Only applies if .light is not forced) */
@media (prefers-color-scheme: dark) {
    :root:not(.light) {
        --bg-color: #000000;
        --panel-bg: #1c1c1e;
        --panel-bg-alpha: rgba(28, 28, 30, 0.85);
        --text-color: #f2f2f7;
        --text-muted: #98989d;
        --accent: #0a84ff;
        --danger: #ff453a;
        --border-color: rgba(84, 84, 88, 0.65);
        --btn-bg: rgba(118, 118, 128, 0.24);
        --btn-active: rgba(118, 118, 128, 0.35);
        --input-bg: rgba(118, 118, 128, 0.24);
        --shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
}

:root.light {
    --bg-color: #f2f2f7;
    --panel-bg: #ffffff;
    --panel-bg-alpha: rgba(255, 255, 255, 0.85);
    --text-color: #1c1c1e;
    --text-muted: #8e8e93;
    --accent: #007aff;
    --border-color: rgba(60, 60, 67, 0.15);
    --btn-bg: rgba(116, 116, 128, 0.08);
    --input-bg: rgba(116, 116, 128, 0.08);
}

/* Global Reset */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
body {
    width: 100%; height: 100%; margin: 0; overflow: hidden; position: relative;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
    display: flex; flex-direction: column; border-radius: 16px;
    background-color: var(--bg-color); color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: 14px; -webkit-text-size-adjust: 100%;
}
*:not(input, textarea) { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }

/* Header */
header {
    height: 50px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
    flex-shrink: 0; position: relative; z-index: 200; cursor: move;
}
.brand-title { min-width: 0; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand-title span.h5 { color: #34c759; }
.brand-title span.gg { color: var(--danger); }
.header-actions { display: flex; flex-shrink: 0; gap: 8px; }
.icon-btn {
    background: transparent; border: none; color: var(--accent); font-size: 18px;
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* Main Layout: Tabs */
.app-content {
    flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.tab-pane {
    position: absolute; inset: 0; display: none; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; padding: 16px; padding-bottom: 80px;
}
.tab-pane.active { display: block; }

/* UI Elements */
h2.section-title { font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px 12px; font-weight: 600; letter-spacing: 0.5px; }
.card-group { background: var(--panel-bg); border-radius: 12px; overflow: hidden; margin-bottom: 24px; border: 1px solid var(--border-color); }
.card-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
.card-row > div { min-width: 0; max-width: 100%; }
.card-row > div[style*="display:flex"] .compact-input { flex: 1 1 0; width: 0 !important; }
.card-row:last-child { border-bottom: none; }
.card-row label { font-weight: 500; font-size: 15px; }

input[type="text"], input[type="number"], select {
    background: var(--input-bg); border: 1px solid transparent; border-radius: 8px;
    padding: 8px 12px; color: var(--text-color); font-size: 15px; min-width: 0; width: 100%;
}
input:focus, select:focus { border-color: var(--accent); }
.compact-input { width: 120px !important; text-align: right; }

button.action-btn {
    background: var(--btn-bg); color: var(--accent); border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: transform 0.1s;
}
button.action-btn:active { background: var(--btn-active); transform: scale(0.97); }
button.primary-btn { background: var(--accent); color: #fff; }
button.primary-btn:active { background: #005bb5; }
button.danger-btn { color: var(--danger); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Bottom Navigation */
.bottom-nav {
    position: relative; width: 100%; height: calc(60px + var(--safe-bottom)); flex-shrink: 0;
    background: var(--panel-bg-alpha); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding-bottom: var(--safe-bottom);
    z-index: 100;
}
.nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-muted); background: transparent; border: none; font-size: 11px; font-weight: 500; gap: 4px; cursor: pointer;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 20px; }

/* Modals & Overlays */
.overlay-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-card {
    background: var(--panel-bg); width: min(340px, 90%); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
    animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-header { padding: 16px; text-align: center; font-weight: 600; border-bottom: 1px solid var(--border-color); font-size: 16px; }
.modal-body { padding: 16px; flex: 1; overflow-y: auto; }
.modal-footer { display: flex; border-top: 1px solid var(--border-color); }
.modal-footer button {
    flex: 1; background: transparent; border: none; padding: 16px; font-size: 16px; font-weight: 500; color: var(--accent); cursor: pointer;
}
.modal-footer button:first-child { border-right: 1px solid var(--border-color); font-weight: 400; }

/* Custom Segmented Control for Data Types */
.segment-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.segment-btn {
    padding: 8px 0; text-align: center; border-radius: 8px; background: var(--btn-bg);
    color: var(--text-color); font-size: 13px; font-weight: 500; border: 2px solid transparent; cursor: pointer;
}
.segment-btn.selected { background: var(--accent); color: #fff; }

/* Results List */
.result-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
.result-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--border-color); background: var(--panel-bg); cursor: pointer;
}
.result-row:first-child { border-top-left-radius: 12px; border-top-right-radius: 12px; }
.result-row:last-child { border-bottom: none; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
.result-info { display: flex; flex-direction: column; gap: 4px; }
.result-addr { font-family: monospace; font-size: 12px; color: var(--text-muted); }
.result-val { font-size: 16px; font-weight: 600; color: var(--accent); }
.result-actions button { font-size: 18px; color: var(--text-muted); background: transparent; border: none; padding: 4px 8px; cursor: pointer; }
.result-actions button.active { color: #ffcc00; }
.result-row.frozen .result-val { color: #34c759; }

/* Viewer & Script Utilities */
.memory-line { display: grid; grid-template-columns: 80px 1fr auto; gap: 8px; align-items: center; padding: 5px 3px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
.memory-line:active { background: rgba(51,147,239,0.14); }

.scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
.scrollbar::-webkit-scrollbar-thumb { background-color: var(--text-muted); border-radius: 10px; }

/* Progress Modals */
#h5ggSearchProgress { position: fixed; inset: 0; z-index: 120000; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
#h5ggSearchProgress .card { min-width: 190px; padding: 24px; border-radius: 16px; background: var(--panel-bg); color: var(--text-color); text-align: center; box-shadow: var(--shadow); }
.spinner { width: 32px; height: 32px; margin: 0 auto 16px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.h5gg-toast { position: fixed; bottom: calc(var(--safe-bottom) + 80px); left: 50%; transform: translateX(-50%); z-index: 120005; padding: 10px 20px; border-radius: 20px; background: rgba(0,0,0,0.85); color: #fff; font-size: 13px; font-weight: 500; opacity: 1; transition: opacity 0.3s; pointer-events: none; }

/* Optional Resize Handle */
#h5ggResizeHandle {
    position: fixed; right: 0; bottom: 0; width: 34px; height: 34px;
    z-index: 110000; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 0% 45%, rgba(0, 122, 255, 0.8) 46% 53%, transparent 54% 62%, rgba(0, 122, 255, 0.8) 63% 70%, transparent 71%);
    border: 0;
}
</style>
<script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
</head>

<body>
<header id="titleBar">
    <div class="brand-title">
        <span class="h5">H5</span><span class="gg">GG</span>
        <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">v8.1</span>
        <span id="crossproc" style="display:none; margin-left:8px; font-size:11px; background:var(--accent); color:#fff; padding:2px 6px; border-radius:10px; cursor:pointer;" onclick="$('#popup_proclist').css('display','flex');">目标: <span id="procname">...</span></span>
    </div>
    <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="切换主题">☾</button>
        <button class="icon-btn" onclick="setWindowVisible(false)" title="关闭">✕</button>
    </div>
</header>

<div class="app-content">
    <!-- TAB: SEARCH -->
    <div id="tab-search" class="tab-pane active scrollbar">
        <h2 class="section-title">内存搜索</h2>
        <div class="card-group">
            <div class="card-row">
                <label>内存范围</label>
                <div style="display:flex; gap:8px; align-items:center;">
                    <input id="range_min" class="compact-input" value="0x10000000" type="text" />
                    <span style="color:var(--text-muted)">-</span>
                    <input id="range_max" class="compact-input" value="0x300000000" type="text" />
                </div>
            </div>
            <div class="card-row" style="justify-content: flex-start; gap: 16px;">
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="radio" name="numtype" value="signed" checked> 有符号
                </label>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="radio" name="numtype" value="unsigned"> 无符号
                </label>
            </div>
            <div class="grid-2" style="padding: 12px;">
                <button class="action-btn primary-btn" onclick="onClickSearchNumber()">新建搜索</button>
                <button class="action-btn" onclick="onClickSearchNearby()">附近搜索</button>
            </div>
        </div>

        <h2 class="section-title">精确与过滤</h2>
        <div class="card-group">
            <div class="card-row">
                <input id="refineValue" type="text" placeholder="精确数值..." style="flex:2" />
                <select id="refineMode" style="flex:1; margin:0 8px;"><option value="0">=</option><option value="2">&gt;</option><option value="3">&lt;</option></select>
                <select id="refineType" style="flex:1;"><option>I8</option><option>U8</option><option>I16</option><option>U16</option><option selected>I32</option><option>U32</option><option>I64</option><option>U64</option><option>F32</option><option>F64</option></select>
            </div>
            <div style="padding: 12px;">
                <button class="action-btn" onclick="refineNumericResults()">精确搜索</button>
            </div>
            <div class="card-row">
                <label>浮点误差</label>
                <div style="display:flex; gap:8px;">
                    <input id="float_tolerance" class="compact-input" value="0.0" type="text" />
                    <button class="action-btn" style="width:auto; padding:8px 12px;" onclick="applyTolerance()">应用</button>
                </div>
            </div>
            <div class="card-row">
                <input id="hexInput" type="text" placeholder="十六进制特征，例如 90 ?? E? AF" style="flex:1; margin-right:8px;" />
                <button class="action-btn" style="width:auto; padding:8px 16px;" onclick="doHexSearch()">十六进制搜索</button>
            </div>
            <div class="card-row">
                <label for="nearby_range">附近范围</label>
                <input id="nearby_range" class="compact-input" value="0x100" type="text" />
            </div>
        </div>
    </div>

    <!-- TAB: RESULTS -->
    <div id="tab-results" class="tab-pane scrollbar">
        <div class="result-toolbar">
            <input id="filterInput" type="search" placeholder="过滤当前结果..." style="flex:1" oninput="filterResults()" />
            <button class="action-btn" style="width:auto; padding:8px 12px;" onclick="onClickRefreshResults()">↻</button>
            <button class="action-btn danger-btn" style="width:auto; padding:8px 12px;" onclick="onClickClearResults()">清空</button>
        </div>
        <div id="results_count" style="padding:0 4px 8px; color:var(--text-muted);">结果数量: 0</div>

        <div class="result-toolbar" style="background:var(--panel-bg); border-radius:8px; padding:4px;">
            <button class="action-btn" style="background:transparent; font-size:12px;" onclick="sortResults('addr')">地址 ↑</button>
            <button class="action-btn" style="background:transparent; font-size:12px;" onclick="sortResults('val')">数值 ↑</button>
            <button class="action-btn" style="background:transparent; font-size:12px;" onclick="onClickEditAll()">全部修改</button>
        </div>

        <div id="listdiv" class="card-group scrollbar" style="margin-top:12px; border:none; border-radius:12px;" onscroll="showMoreResults(this);">
            <div class="empty-state" style="padding: 40px 16px; text-align: center; color: var(--text-muted);">未找到结果。请开始搜索。</div>
        </div>
    </div>

    <!-- TAB: TOOLS -->
    <div id="tab-tools" class="tab-pane scrollbar">
        <h2 class="section-title">内存工具</h2>
        <div class="card-group grid-2" style="padding: 12px; gap: 8px;">
            <button class="action-btn" onclick="openMemoryViewer()">内存视图</button>
            <button class="action-btn" onclick="openPointerChain()">指针链</button>
            <button class="action-btn" onclick="openDumpPanel()">内存转储</button>
            <button class="action-btn" onclick="openOffsetCalc()">偏移计算器</button>
        </div>

        <h2 class="section-title">数据与脚本</h2>
        <div class="card-group grid-2" style="padding: 12px; gap: 8px;">
            <button class="action-btn" onclick="openBookmarksPanel()">书签</button>
            <button class="action-btn" onclick="openFreezePanel()">锁定数值</button>
            <button class="action-btn" onclick="openHistoryPanel()">搜索历史</button>
            <button class="action-btn" onclick="openScriptEditor()">脚本编辑器</button>
            <button class="action-btn" onclick="onShowLoadScript(true)">加载脚本</button>
            <button class="action-btn" onclick="onClickMakeTweak()">制作插件</button>
        </div>

        <h2 class="section-title">设置</h2>
        <div class="card-group">
            <div class="card-row">
                <label>自动运行脚本</label>
                <select id="autorunSelect" class="compact-input" style="width:160px;" onchange="setAutorun()">
                    <option value="">-- 无 --</option>
                </select>
            </div>
            <div style="padding: 12px;">
                <button class="action-btn" onclick="openSettings()">高级设置</button>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Navigation Bar -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('search', this)">
        <span class="nav-icon">⌕</span><span>搜索</span>
    </button>
    <button class="nav-item" onclick="switchTab('results', this)">
        <span class="nav-icon">≡</span><span id="tab-results-badge">结果 (0)</span>
    </button>
    <button class="nav-item" onclick="switchTab('tools', this)">
        <span class="nav-icon">⚙</span><span>工具</span>
    </button>
</nav>

<!-- Modals -->

<!-- Search Number Modal -->
<div id="maskview" class="overlay-mask">
    <div id="popup_search_edit" class="modal-card">
        <div id="popupTitle" class="modal-header">搜索数值</div>
        <div class="modal-body">
            <div class="segment-group" id="datatype_segments">
                <div class="segment-btn" data-type="F32">F32</div>
                <div class="segment-btn" data-type="F64">F64</div>
                <div class="segment-btn" data-type="I8">I8</div>
                <div class="segment-btn" data-type="I16">I16</div>
                <div class="segment-btn selected" data-type="I32">I32</div>
                <div class="segment-btn" data-type="I64">I64</div>
            </div>
            <input type="text" id="datavalue" placeholder="输入数值..." style="font-size:16px; padding:12px; border:1px solid var(--border-color);" autocomplete="off" />
            <table id="datatype" style="display:none;"><tr>
                <td>F32</td><td>F64</td><td>I8</td><td>I16</td><td class="selected">I32</td><td>I64</td>
            </tr></table>
        </div>
        <div class="modal-footer">
            <button id="cancel" style="color:var(--text-color);">取消</button>
            <button id="action" style="font-weight:600;">搜索</button>
        </div>
    </div>
</div>

<!-- Target Process Selector -->
<div id="popup_proclist" class="overlay-mask">
    <div class="modal-card">
        <div class="modal-header">选择目标进程</div>
        <div class="modal-body scrollbar" id="proctable" style="max-height:60vh; padding:8px;">
            <!-- Process buttons injected here -->
        </div>
        <div class="modal-footer">
            <button onclick="$('#popup_proclist').hide();">取消</button>
        </div>
    </div>
</div>

<!-- Load Scripts Modal -->
<div id="popup_loadscripts" class="overlay-mask">
    <div class="modal-card">
        <div class="modal-header" style="display:flex; padding:8px; gap:4px;">
            <button class="action-btn" style="flex:1; background:var(--accent); color:#fff;" onclick="$('#netjs').hide(); $('#localjslist').show();">本地</button>
            <button class="action-btn" style="flex:1;" onclick="$('#localjslist').hide(); $('#netjs').show();">网络</button>
        </div>
        <div class="modal-body scrollbar" style="padding:0; max-height:50vh;">
            <table id="localjslist" style="width:100%; border-collapse:collapse;"><tbody></tbody></table>
            <div id="netjs" style="display:none; padding:16px;">
                <input id="netjsurl" type="text" placeholder="https://..." style="margin-bottom:12px;"/>
                <div class="grid-2">
                    <button class="action-btn primary-btn" onclick="onClickLoadScript($('#netjsurl').val(), 'js')">加载 JS</button>
                    <button class="action-btn" onclick="onClickLoadScript($('#netjsurl').val(), 'h5')">加载 HTML</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="onShowLoadScript(false)">关闭</button>
        </div>
    </div>
</div>

<div id="maskview_script" class="overlay-mask" style="z-index: 120000; background:rgba(0,0,0,0.6);">
    <div style="background:var(--panel-bg); padding:20px; border-radius:12px; box-shadow:var(--shadow);">正在运行脚本...</div>
</div>

<!-- Core Scripts Section -->
<script>
// --- UI Layout Management ---
function switchTab(tabId, btnElement) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
    btnElement.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
}

function closeOverlay(id) {
    var el = document.getElementById(id);
    if(el) el.remove();
}

function showToast(msg) {
    var toast = document.createElement('div');
    toast.className = 'h5gg-toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 2000);
}

// Hook Segment Control to fake Table clicks for underlying logic
document.querySelectorAll('.segment-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        let type = btn.getAttribute('data-type');
        $('table#datatype td').removeClass('selected');
        $('table#datatype td:contains('+type+')').addClass('selected');
    });
});

// Update Badge Logic
const originalText = $.fn.text;
$.fn.text = function(val) {
    if(this.attr('id') === 'results_count' && val !== undefined) {
        let count = val.replace(/\D/g, '');
        document.getElementById('tab-results-badge').textContent = `结果 (${count})`;
    }
    return originalText.apply(this, arguments);
};

// Fixed Theme Management (Solves the media query overriding issue)
function toggleTheme() {
    let root = document.documentElement;
    if(root.classList.contains('dark')) {
        root.classList.remove('dark');
        root.classList.add('light');
        localStorage.setItem('h5gg_theme', 'light');
    } else if(root.classList.contains('light')) {
        root.classList.remove('light');
        root.classList.add('dark');
        localStorage.setItem('h5gg_theme', 'dark');
    } else {
        // Toggle from auto -> explicit opposite
        let isSystemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if(isSystemDark) {
            root.classList.add('light');
            localStorage.setItem('h5gg_theme', 'light');
        } else {
            root.classList.add('dark');
            localStorage.setItem('h5gg_theme', 'dark');
        }
    }
}
(function() {
    let theme = localStorage.getItem('h5gg_theme');
    if(theme === 'dark') document.documentElement.classList.add('dark');
    else if(theme === 'light') document.documentElement.classList.add('light');
})();

(function() {
    var origLog = console.log;
    console.log = function() {
        origLog.apply(console, arguments);
        try {
            var msg = Array.prototype.slice.call(arguments).join(' ');
            if(typeof h5gg != 'undefined' && h5gg.appendLog) {
                h5gg.appendLog('[HH5GG] ' + new Date().toLocaleTimeString() + ' ' + msg);
            }
        } catch(e) {}
    };
})();

function h5ggType(type) {
    if($("input:radio[name=numtype]:checked").val()=="unsigned") {
        switch(type) {
            case "I8": return "U8";
            case "I16": return "U16";
            case "I32": return "U32";
            case "I64": return "U64";
        }
    }
    return type;
}

document.addEventListener("DOMContentLoaded", function(){
    if(typeof $ == 'undefined') { alert("jquery load failed!"); return; }
    document.body.onselectstart = document.body.ondrag = function(){ return false; }
    $("input").blur(function(){ window.scroll(0,0); });
    document.body.addEventListener('touchstart', function () {});

    if(typeof h5gg!='undefined') {
        onClickClearResults();

        setWindowDrag(0, 0, Math.round(innerWidth), 50);

        var checkprocs = async function() {
            var procs = await h5gg.getProcList();
            if(procs) {
                refreshProcList(procs);
                $("#crossproc").show();
                if(!$("#procname").attr('pid')) {
                    $("#popup_proclist").css('display','flex');
                    $("#procname").text('');
                }
                setInterval(async function(){
                    if($("#popup_proclist").is(":visible")) refreshProcList(await h5gg.getProcList());
                    if($("#procname").attr('pid')) {
                        var targetStatus = await h5gg.getTargetStatus();
                        if(!(targetStatus && targetStatus.available)) {
                            alert("目标进程已终止");
                            $("#procname").removeAttr('pid');
                            $("#procname").text('...');
                        }
                    }
                }, 1500);
            }
        };
        checkprocs();
        checkAutorun();
    }
});

function refreshProcList(procs) {
    $("#proctable button").remove();
    for(var i=0; i<procs.length; i++) {
        var proc = procs[i];
        var btn = $("<button class='action-btn' style='margin-bottom:8px; text-align:left; background:var(--btn-bg);'>"+proc.name+"</button>");
        btn.attr("pid", proc.pid);
        btn.click(async function() {
            if(!await h5gg.setTargetProc(Number($(this).attr('pid')))) { alert("无法选择目标进程！"); return; }
            onClickClearResults();
            $("#procname").attr('pid', $(this).attr('pid'));
            $("#procname").text($(this).text());
            $("#popup_proclist").hide();
        });
        $("#proctable").append(btn);
    }
}

window.gAllResults = [];
window.gCurrentCount = 0;

function onClickClearResults() {
    $("input#datavalue").val("");
    $("#results_count").text('结果数量: 0').show();
    gAllResults = [];
    gCurrentCount = 0;
    renderResults([]);
    if(typeof h5gg!='undefined') h5gg.clearResults();
    $('#tab-results-badge').text('结果 (0)');
}

async function loadResults(from, count) {
    var results = await h5gg.getResults(count, from);
    for(var i=0; i<results.length; i++) {
        if(results[i].type=='F32' || results[i].type=='F64') results[i].value = '('+results[i].value+')';
    }
    if(from == 0) gAllResults = results;
    else gAllResults = gAllResults.concat(results);
    renderResults(gAllResults);
}

async function loadMoreResults() {
    var from = gCurrentCount;
    gCurrentCount += 100;
    await loadResults(from, 100);
}

async function showMoreResults(div) {
    var lh = div.scrollHeight - div.scrollTop;
    if(lh <= div.clientHeight + 10) await loadMoreResults();
}

function onClickEditAll() {

}

function escapeScriptText(value) {
    return String(value).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

function getResultCopyText(result, action) {
    if(!result) return null;
    if(action === 'address') return result.address;
    if(action === 'value') return result.value;
    if(action === 'both') return result.address + ' = ' + result.value + ' [' + result.type + ']';
    return null;
}

// Search wrappers
(function() {
    'use strict';

    function showSearchProgress() {
        var overlay = document.createElement('div');
        overlay.id = 'h5ggSearchProgress';
        overlay.innerHTML = '<div class="card"><div class="spinner"></div><div style="font-weight:600;">正在搜索内存...</div></div>';
        document.body.appendChild(overlay);
    }
    function finishSearchProgress(succeeded, message) {
        var overlay = document.getElementById('h5ggSearchProgress');
        if(overlay) overlay.remove();
        showToast(message || (succeeded ? "搜索完成" : "搜索失败"));
    }

    async function runSearch(operation) {
        showSearchProgress();
        try { await operation(); finishSearchProgress(true); return true; }
        catch(error) { finishSearchProgress(false, error.message); return false; }
    }

    window.showPopView = function(name, action, type, value) {
        var mask = $('#maskview');
        var popup = $('#popup_search_edit');
        mask.css('display','flex');
        popup.find('#popupTitle').html(name);
        popup.find('button#action').html(name);

        if(type) {
            $('.segment-btn').removeClass('selected');
            $('.segment-btn[data-type="'+type+'"]').addClass('selected');
            $('table#datatype td').removeClass('selected');
            $('table#datatype td:contains('+type+')').addClass('selected');
        }

        popup.find('#datavalue').val(value == null ? '' : value);
        popup.find('button#action').off('click').on('click', async function() {
            var selectedType = $('table#datatype td.selected').text() || 'I32';
            var selectedValue = popup.find('#datavalue').val();
            mask.hide();
            await action(selectedType, selectedValue);
        });
        popup.find('button#cancel').off('click').on('click', function() { mask.hide(); });
    };

    window.onClickSearchNumber = function() {
        showPopView("新建搜索", function(type, value) {
            return runSearch(async function() {
                await h5gg.setFloatTolerance($('#float_tolerance').val());
                await h5gg.searchNumber(value, h5ggType(type), $('#range_min').val(), $('#range_max').val());
                await h5gg.addSearchHistory(value, h5ggType(type), await h5gg.getResultsCount());
                await window.onClickRefreshResults(true);
                switchTab('results', document.querySelectorAll('.nav-item')[1]);
            });
        });
    };

    window.onClickSearchNearby = function() {
        showPopView("附近搜索", function(type, value) {
            return runSearch(async function() {
                await h5gg.setFloatTolerance($('#float_tolerance').val());
                await h5gg.searchNearby(value, h5ggType(type), $('#nearby_range').val());
                await window.onClickRefreshResults(true);
                switchTab('results', document.querySelectorAll('.nav-item')[1]);
            });
        });
    };

    window.onClickRefreshResults = async function(clean) {
        if(clean) { var d = document.getElementById('listdiv'); if(d) d.scrollTop = 0; window.gCurrentCount = 0; }
        var count = await h5gg.getResultsCount();
        $('#results_count').text('结果数量: ' + count);
        document.getElementById('results_count').style.display = 'block';
        if(window.gCurrentCount === 0) window.gCurrentCount = 100;
        await loadResults(0, window.gCurrentCount);
    };

    window.doHexSearch = function() {
        var value = document.getElementById('hexInput').value.trim();
        if(!value) return;
        return runSearch(async function() {
            await h5gg.searchHex(value, $('#range_min').val(), $('#range_max').val());
            window.gAllResults = []; window.gCurrentCount = 0;
            var count = await h5gg.getResultsCount();
            $('#results_count').text("结果数量: "+count);
            document.getElementById('results_count').style.display = 'block';
            await loadResults(0, 100);
            await h5gg.addSearchHistory(value, 'Hex', count);
            switchTab('results', document.querySelectorAll('.nav-item')[1]);
        });
    };

    window.refineNumericResults = function() {
        var value = document.getElementById('refineValue').value.trim();
        if(!value) return;
        return runSearch(async function() {
            await h5gg.searchFilter(value, document.getElementById('refineType').value, Number(document.getElementById('refineMode').value));
            await window.onClickRefreshResults(true);
            switchTab('results', document.querySelectorAll('.nav-item')[1]);
        });
    };

    window.renderResults = function(results) {
        var display = document.getElementById('listdiv');
        if(!display) return;
        var html = '';
        (results || []).forEach(function(result) {
            var address = escapeScriptText(result.address);
            var type = escapeScriptText(result.type);
            var value = escapeScriptText(result.value);
            html += '<div class="result-row" data-addr="'+address+'" data-type="'+type+'" data-value="'+value+'" onclick="openMemoryEditor(\''+address+'\',\''+type+'\')">';
            html += '<div class="result-info"><div class="result-addr">'+address+' ['+type+']</div><div class="result-val">'+value+'</div></div>';
            html += '<div class="result-actions" onclick="event.stopPropagation()">';
            html += '<button onclick="saveBookmark(\''+address+'\',\''+type+'\')">☆</button>';
            html += '<button onclick="freezeResult(\''+address+'\',\''+value+'\',\''+type+'\')">❄</button></div></div>';
        });
        if(!results || results.length === 0) html = '<div class="empty-state" style="padding:40px 16px;text-align:center;color:var(--text-muted);">无结果</div>';
        display.innerHTML = html;
    };
})();

window.deleteCurrentScript = async function() {
    var name = document.getElementById('scriptFileName').value;

window.runCurrentScript = function() {
    var fn = document.getElementById('scriptFileName').value;
    if(fn.toLowerCase().endsWith('.html')) return showToast('HTML 文件无法在此处运行。');
    runScript(document.getElementById('scriptEditor').value, fn);
};

window.runScript = function(code, filename) {
    try {
        var sandbox = { console:console, setTimeout:setTimeout, alert:alert, confirm:confirm, prompt:prompt, h5gg:window.h5gg, Number:Number, String:String, Math:Math, JSON:JSON, parseInt:parseInt, parseFloat:parseFloat };
        var argNames = Object.keys(sandbox);
        var argValues = argNames.map(k => sandbox[k]);
        var fn = new Function(argNames.join(','), code);
        fn.apply(null, argValues);
        showToast('脚本已运行: ' + (filename || '未命名'));
        return true;
    } catch(e) {
        showToast('脚本错误: ' + e.message);
        return false;
    }
};

window.onClickLoadScript = async function(source, type) {
    if(!source) return;
    var isRemote = /^https?:\/\//i.test(source);
    var isJavaScript = type === 'js' || (!type && /\.js(?:$|[?#])/i.test(source));
    $('#maskview_script').css('display', 'flex');
    try {
        if(isRemote) {
            if(!isJavaScript) { location.href = source; return; }
            await new Promise((resolve, reject) => {
                var script = document.createElement('script');
                script.onload = resolve; script.onerror = reject; script.src = source;
                document.body.appendChild(script);
            });
        } else {
            var content = await h5gg.loadScript(source);
            if(content == null) throw new Error("Load failed");
            if(isJavaScript) runScript(content, source);
            else { document.open(); document.write(content); document.close(); return; }
        }
        showToast('脚本已加载');
    } catch(e) {
        showToast('加载脚本失败');
    } finally {
        $('#maskview_script').hide();
        $('#popup_loadscripts').hide();
    }
};

window.checkAutorun = async function() {
    var name = localStorage.getItem('h5gg_autorun');
    if(!name || !name.toLowerCase().endsWith('.js') || typeof h5gg == 'undefined') return;
    try {
        var content = await h5gg.loadScript(name);
        if(content) runScript(content, name);
    } catch(e) {}
};

window.setAutorun = function() {
    var sel = document.getElementById('autorunSelect');
    localStorage.setItem('h5gg_autorun', sel ? sel.value : '');
    showToast("自动运行配置已保存");
};

// --- Calculator ---
window.openOffsetCalc = function() {
    var html = '<div id="calcOverlay" class="overlay-mask" style="display:flex;">';
    html += '<div class="modal-card">';
    html += '<div class="modal-header">偏移计算器</div>';
    html += '<div class="modal-body" style="display:flex; flex-direction:column; gap:12px;">';
    html += '<div><label style="font-weight:600; font-size:12px;">基址:</label><input id="calcBase" type="text" placeholder="0x..." /></div>';
    html += '<div><label style="font-weight:600; font-size:12px;">偏移:</label><input id="calcOffset" type="text" placeholder="0x... 或十进制" /></div>';
    html += '<div><label style="font-weight:600; font-size:12px;">结果:</label><input id="calcResult" type="text" readonly style="color:var(--accent); font-family:monospace;" /></div>';
    html += '<div class="grid-2"><button class="action-btn" onclick="doCalc()">计算</button><button class="action-btn" onclick="copyCalcResult()">复制</button></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button onclick="closeOverlay(\'calcOverlay\')">关闭</button></div>';
    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
};

window.doCalc = function() {
    var base = document.getElementById('calcBase').value.trim();
    var off = document.getElementById('calcOffset').value.trim();
    if(!base || !off) return;
    try {
        var baseHex = base.startsWith('0x') ? base.substring(2) : Number(base).toString(16);
        var offHex = off.startsWith('0x') ? off.substring(2) : Number(off).toString(16);
        var result = (parseInt(baseHex, 16) + parseInt(offHex, 16)).toString(16);
        document.getElementById('calcResult').value = '0x' + result.toUpperCase();
    } catch(e) { showToast("格式无效"); }
};

window.copyCalcResult = async function() {
    var r = document.getElementById('calcResult').value;
    if(r) { await h5gg.copyText(r); showToast("已复制"); }
};

// --- Pointer Chain ---
window.openPointerChain = function() {
    window.gPointerChain = [];
    var html = '<div id="ptrOverlay" class="overlay-mask" style="display:flex;">';
    html += '<div class="modal-card" style="height:70vh;">';
    html += '<div class="modal-header">指针链</div>';
    html += '<div class="modal-body scrollbar" style="display:flex; flex-direction:column; gap:8px;">';
    html += '<input id="ptrBase" type="text" placeholder="基址 (0x...)" />';
    html += '<div style="display:flex; gap:8px;"><input id="ptrOffset" type="text" placeholder="偏移" style="flex:1;" /><button class="action-btn" style="width:auto;" onclick="addPtrStep()">添加+读取</button></div>';
    html += '<div id="ptrChainDisplay" style="flex:1; background:var(--input-bg); border-radius:8px; padding:8px; font-family:monospace; font-size:12px; overflow-y:auto; border:1px solid var(--border-color);">输入基址，然后输入偏移以读取指针链。</div>';
    html += '</div>';
    html += '<div class="modal-footer"><button onclick="closeOverlay(\'ptrOverlay\')">关闭</button></div>';
    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
};

window.addPtrStep = async function() {
    if(gPointerChain.length == 0) {
        var base = document.getElementById('ptrBase').value.trim();
        if(!base) return;
        gPointerChain.push(base);
    }
    var off = document.getElementById('ptrOffset').value.trim();
    if(!off) return;

    var currentAddr = gPointerChain[gPointerChain.length - 1];
    var target;
    try {
        var offset = off.startsWith('-0x') ? -BigInt('0x'+off.substring(3)) : BigInt(off);
        target = BigInt(currentAddr) + offset;
    } catch(e) { return showToast('偏移无效'); }

    var targetAddr = '0x' + target.toString(16).toUpperCase();
    var value = await h5gg.readPointer(targetAddr);

    var display = document.getElementById('ptrChainDisplay');
    if(display.innerHTML.includes("输入基址")) display.innerHTML = "";

    var line = '<div style="padding:4px; border-bottom:1px solid var(--border-color);">['+gPointerChain.length+'] <span style="color:var(--accent);">'+targetAddr+'</span> + '+off+' = <b>'+(value||'失败')+'</b></div>';
    display.insertAdjacentHTML('beforeend', line);

    if(value) {
        gPointerChain.push(value);
        document.getElementById('ptrOffset').value = '';
    } else {
        showToast('读取指针失败');
    }
};

// --- Memory Dump ---
window.openDumpPanel = function() {
    var html = '<div id="dumpOverlay" class="overlay-mask" style="display:flex;">';
    html += '<div class="modal-card">';
    html += '<div class="modal-header">内存转储</div>';
    html += '<div class="modal-body" style="display:flex; flex-direction:column; gap:12px;">';
    html += '<div><label style="font-size:12px;">起始地址:</label><input id="dumpStart" type="text" placeholder="0x..." /></div>';
    html += '<div><label style="font-size:12px;">结束地址:</label><input id="dumpEnd" type="text" placeholder="0x..." /></div>';
    html += '<div><label style="font-size:12px;">文件名:</label><input id="dumpName" type="text" value="dump.bin" /></div>';
    html += '<div id="dumpStatus" style="font-size:12px; color:var(--text-muted); text-align:center;"></div>';
    html += '<div class="grid-2"><button class="action-btn primary-btn" onclick="doDump()">转储</button><button class="action-btn" onclick="cancelDump()">取消</button></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button onclick="closeOverlay(\'dumpOverlay\')">关闭</button></div>';
    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
};

window.doDump = async function() {
    var start = document.getElementById('dumpStart').value.trim();
    var end = document.getElementById('dumpEnd').value.trim();
    var name = document.getElementById('dumpName').value.trim();
    if(!start || !end || !name) return;

    var status = document.getElementById('dumpStatus');
    status.textContent = '转储中... 0%';

    var poll = setInterval(async function() {
        var current = await h5gg.getDumpStatus();
        if(current && current.state == 'running') status.textContent = '转储中... ' + Math.floor((current.progress || 0) * 100) + '%';
    }, 250);

    try {
        var ok = await h5gg.dumpMemory(start, end, name);
        status.textContent = ok ? '已保存至 Documents/'+name : '转储失败';
        if(ok) setTimeout(() => closeOverlay('dumpOverlay'), 1500);
    } catch(e) { status.textContent = '错误: ' + e; }
    finally { clearInterval(poll); }
};

window.cancelDump = async function() { await h5gg.cancelDump(); };

// --- Memory Viewer ---
var binaryBaseAddress = null;
window.getBinaryBaseAddress = async function() {
    if(binaryBaseAddress) return binaryBaseAddress;
    if(typeof h5gg !== 'undefined') {
        var ranges = await h5gg.getRangesList('0');
        if(ranges && ranges.length) binaryBaseAddress = ranges[0].start;
    }
    return binaryBaseAddress;
};

window.openMemoryViewer = async function() {
    var base = await getBinaryBaseAddress();
    if(base) window.gViewerAddr = base;
    var html = '<div id="viewerOverlay" class="overlay-mask" style="display:flex; z-index:119999;">';
    html += '<div class="modal-card" style="width:95%; height:90vh;">';
    html += '<div class="modal-header">内存视图</div>';
    html += '<div class="modal-body" style="display:flex; flex-direction:column; padding:0;">';
    html += '<div style="display:flex; gap:4px; padding:8px; border-bottom:1px solid var(--border-color);">';
    html += '<input id="viewerAddr" type="text" value="'+(window.gViewerAddr||'0x0')+'" style="font-family:monospace; flex:1;" />';
    html += '<button class="action-btn" style="width:auto; padding:8px 12px;" onclick="viewerGo()">跳转</button>';
    html += '</div>';
    html += '<div style="display:flex; padding:4px; gap:4px; background:var(--panel-bg);">';
    html += '<button class="action-btn" style="padding:4px; font-size:11px;" onclick="viewerPage(-1)">-Pg</button>';
    html += '<button class="action-btn" style="padding:4px; font-size:11px;" onclick="viewerStep(-16)">-16</button>';
    html += '<button class="action-btn" style="padding:4px; font-size:11px;" onclick="viewerStep(16)">+16</button>';
    html += '<button class="action-btn" style="padding:4px; font-size:11px;" onclick="viewerPage(1)">+Pg</button>';
    html += '</div>';
    html += '<div id="viewerDump" class="scrollbar" style="flex:1; overflow-y:auto; padding:4px;"></div>';
    html += '</div>';
    html += '<div class="modal-footer"><button onclick="closeOverlay(\'viewerOverlay\')">关闭</button></div>';
    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    await viewerGo();
};

window.viewerGo = async function() {
    var input = document.getElementById('viewerAddr');
    if(!input) return;
    try {
        var address = BigInt(input.value.trim());
        window.gViewerAddr = '0x' + address.toString(16).toUpperCase();
    } catch(error) { return document.getElementById('viewerDump').textContent = '地址无效'; }
    input.value = window.gViewerAddr;
    await viewerRefresh();
};

window.viewerStep = async function(delta) {
    var addr = BigInt(window.gViewerAddr) + BigInt(delta);
    if(addr < 0n) addr = 0n;
    window.gViewerAddr = '0x' + addr.toString(16).toUpperCase();
    document.getElementById('viewerAddr').value = window.gViewerAddr;
    await viewerRefresh();
};

window.viewerPage = async function(dir) { await viewerStep(dir * 256); };

window.viewerRefresh = async function() {
    var dump = document.getElementById('viewerDump');
    if(!dump || !window.gViewerAddr) return;
    var address = BigInt(window.gViewerAddr);
    var page = await h5gg.readMemoryPage(window.gViewerAddr, 256);
    if(!page || page.error) { dump.textContent = '读取内存失败'; return; }

    dump.innerHTML = '';
    for(var line = 0; line < page.bytes.length; line += 16) {
        var lineAddress = '0x' + (address + BigInt(line)).toString(16).toUpperCase().padStart(12, '0');
        var values = page.bytes.slice(line, line + 16);

        var row = document.createElement('div');
        row.className = 'memory-line';

        var hex = values.map(function(v) { return v == null ? '??' : Number(v).toString(16).toUpperCase().padStart(2, '0'); }).join(' ');
        var ascii = values.map(function(v) { return v >= 32 && v <= 126 ? String.fromCharCode(v) : '.'; }).join('');

        row.innerHTML = '<span style="font-family:monospace; font-size:10px; color:var(--accent);">'+lineAddress+'</span><span style="font-family:monospace; font-size:10px;">'+hex+'</span><span style="font-family:monospace; font-size:10px;">|'+escapeScriptText(ascii)+'|</span>';
        dump.appendChild(row);
    }
};

    html += '<div class="modal-header">设置</div>';

    html += '<div><label style="font-size:12px;">默认搜索结束地址:</label><input id="setRangeEnd" type="text" value="'+(localStorage.getItem('h5gg_rangeEnd')||'0xFFFFFFFF00000000')+'" /></div>';
    html += '<div><label style="font-size:12px;">默认搜索类型:</label><select id="setSearchType">';
    var types = ['I8','U8','I16','U16','I32','U32','I64','U64','F32','F64'];
    var savedType = localStorage.getItem('h5gg_searchType') || 'I32';
    types.forEach(t => { html += '<option value="'+t+'"'+(t===savedType?' selected':'')+'>'+t+'</option>'; });
    html += '</select></div>';
    html += '<div><label style="font-size:12px;">窗口大小调整:</label><button class="action-btn" style="margin-top:4px;" onclick="toggleResizeHandle()">切换大小调整手柄</button></div>';
    html += '<div id="settingsStatus" style="font-size:12px; color:var(--accent); text-align:center;"></div>';

    html += '</div>';
    html += '<div class="modal-footer"><button onclick="closeOverlay(\'settingsOverlay\')">关闭</button></div>';
    html += '</div></div>';

window.saveSettings = function() {
    var start = document.getElementById('setRangeStart').value.trim();
    var end = document.getElementById('setRangeEnd').value.trim();
    var type = document.getElementById('setSearchType').value;
    if(start) localStorage.setItem('h5gg_rangeStart', start);
    if(end) localStorage.setItem('h5gg_rangeEnd', end);
    localStorage.setItem('h5gg_searchType', type);
    document.getElementById('settingsStatus').textContent = '设置已保存';
    setTimeout(() => closeOverlay('settingsOverlay'), 1000);
};

window.onClickMakeTweak = async function() {
    alert("制作自定义插件\n第一步：选择悬浮窗图标图片");
    var icon = await h5gg.pickScriptFile(["public.image"]);
    if(!icon) return;
    alert("第二步：选择需要自动加载的 html 文件");
    var html = await h5gg.pickScriptFile(["public.html"]);
    if(!html) return;
    alert(await h5gg.makeTweak(icon, html));
};
