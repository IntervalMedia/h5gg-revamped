<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>H5GG Draw ESP</title>
<style>
:root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --panel: rgba(16, 20, 29, 0.92);
    --border: rgba(255, 255, 255, 0.14);
    --muted: #a9b2c3;
    --green: #36e38f;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
}

#esp-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#control-panel {
    position: fixed;
    z-index: 10;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    width: min(300px, calc(100vw - 32px));
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.36);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transform: translateX(-50%);
}

#control-panel[hidden] {
    display: none;
}

.eyebrow {
    margin: 0 0 5px;
    color: var(--green);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.02em;
}

.intro {
    margin: 7px 0 14px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

button {
    min-height: 44px;
    border: 0;
    border-radius: 11px;
    padding: 0 12px;
    color: #07140e;
    background: var(--green);
    font: inherit;
    font-size: 14px;
    font-weight: 750;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.48;
}

button:focus-visible {
    outline: 3px solid rgba(54, 227, 143, 0.38);
    outline-offset: 2px;
}

#stop-button {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
}

#hide-button {
    grid-column: 1 / -1;
    color: #ffd9dc;
    background: rgba(255, 93, 104, 0.14);
}

#live-status {
    min-height: 18px;
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
}

#live-status[data-tone="good"] {
    color: var(--green);
}

#live-status[data-tone="warn"] {
    color: #ffbd66;
}

@media (prefers-reduced-motion: reduce) {
    button:active {
        transform: none;
    }
}
</style>
</head>
<body>
<canvas id="esp-canvas" aria-hidden="true"></canvas>

<section id="control-panel" aria-labelledby="panel-title">
    <p class="eyebrow">Canvas tutorial</p>
    <h1 id="panel-title">Draw ESP</h1>
    <p class="intro">A transparent overlay with animated boxes, tracers, a radius guide, and an FPS counter.</p>
    <div class="actions">
        <button id="start-button" type="button">Start drawing</button>
        <button id="stop-button" type="button">Stop drawing</button>
        <button id="hide-button" type="button">Hide controls</button>
    </div>
    <p id="live-status" role="status" aria-live="polite">Preparing browser preview…</p>
</section>

<script>
(() => {
    "use strict";

    const canvas = document.querySelector("#esp-canvas");
    const panel = document.querySelector("#control-panel");
    const status = document.querySelector("#live-status");
    const hideButton = document.querySelector("#hide-button");
    const context = canvas.getContext("2d", { alpha: true, desynchronized: true });
    const state = {
        drawing: false,
        width: 1,
        height: 1,
        roles: [],
        lastFrame: performance.now(),
        fpsStarted: performance.now(),
        fpsFrames: 0,
        fps: 0
    };

    const hasWindowControls = () => [
        "setWindowRect",
        "setWindowDrag",
        "setWindowTouch",
        "setLayoutAction",
        "setButtonAction"
    ].every((name) => typeof window[name] === "function");

    function setStatus(message, tone = "") {
        status.textContent = message;
        status.dataset.tone = tone;
    }

    function createRoles() {
        state.roles = Array.from({ length: 8 }, () => ({
            x: 30 + Math.random() * Math.max(1, state.width - 130),
            y: state.height * (0.3 + Math.random() * 0.4),
            scale: 0.65 + Math.random() * 0.75,
            vx: (Math.random() - 0.5) * 52,
            vy: (Math.random() - 0.5) * 38
        }));
    }

    function resizeCanvas(width = window.innerWidth, height = window.innerHeight) {
        state.width = Math.max(1, Math.floor(width));
        state.height = Math.max(1, Math.floor(height));
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.floor(state.width * pixelRatio);
        canvas.height = Math.floor(state.height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        createRoles();
    }

    function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
    }

    function updateRoles(deltaSeconds) {
        for (const role of state.roles) {
            const boxWidth = 52 * role.scale;
            const boxHeight = 104 * role.scale;
            role.x += role.vx * deltaSeconds;
            role.y += role.vy * deltaSeconds;

            if (role.x < 0 || role.x + boxWidth > state.width) {
                role.x = Math.max(0, Math.min(role.x, state.width - boxWidth));
                role.vx *= -1;
            }
            if (role.y < 90 || role.y + boxHeight > state.height) {
                role.y = Math.max(90, Math.min(role.y, state.height - boxHeight));
                role.vy *= -1;
            }
        }
    }

    function drawFrame() {
        context.clearRect(0, 0, state.width, state.height);
        if (!state.drawing) return;

        roundedRect(state.width / 2 - 44, 22, 88, 34, 12);
        context.fillStyle = "rgba(255, 93, 104, 0.78)";
        context.fill();
        context.fillStyle = "#fff";
        context.font = "700 15px -apple-system, sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(`${state.fps} FPS`, state.width / 2, 39);

        for (const role of state.roles) {
            const boxWidth = 52 * role.scale;
            const boxHeight = 104 * role.scale;
            context.strokeStyle = "rgba(54, 227, 143, 0.92)";
            context.lineWidth = 2;
            context.strokeRect(role.x, role.y, boxWidth, boxHeight);
            context.beginPath();
            context.moveTo(state.width / 2, 57);
            context.lineTo(role.x + boxWidth / 2, role.y);
            context.stroke();
        }

        context.beginPath();
        context.strokeStyle = "rgba(255, 93, 104, 0.78)";
        context.lineWidth = 2;
        context.arc(state.width / 2, state.height / 2, Math.min(150, state.width * 0.32), 0, Math.PI * 2);
        context.stroke();
    }

    function animationLoop(now) {
        const deltaSeconds = Math.min((now - state.lastFrame) / 1000, 0.1);
        state.lastFrame = now;

        if (state.drawing) {
            updateRoles(deltaSeconds);
            state.fpsFrames++;
            if (now - state.fpsStarted >= 1000) {
                state.fps = Math.round(state.fpsFrames * 1000 / (now - state.fpsStarted));
                state.fpsFrames = 0;
                state.fpsStarted = now;
            }
            drawFrame();
        }
        window.setTimeout(() => animationLoop(performance.now()), 33);
    }

    async function updateTouchRegion() {
        if (typeof window.setWindowTouch !== "function") return;
        if (panel.hidden) {
            await setWindowTouch(0, 0, 0, 0);
            return;
        }
        const rect = panel.getBoundingClientRect();
        await setWindowTouch(
            Math.round(rect.left),
            Math.round(rect.top),
            Math.round(rect.width),
            Math.round(rect.height)
        );
    }

    async function setPanelVisible(visible) {
        panel.hidden = !visible;
        try {
            await updateTouchRegion();
        } catch (error) {
            setStatus(`Touch setup failed: ${error.message || error}`, "warn");
        }
    }

    async function applyHostLayout(width, height) {
        const safeWidth = Math.max(1, Math.floor(width));
        const safeHeight = Math.max(1, Math.floor(height));
        await setWindowRect(0, 0, safeWidth, safeHeight);
        resizeCanvas(safeWidth, safeHeight);
        await updateTouchRegion();
    }

    // The host calls these globals after their matching actions are registered.
    window.h5gg_onLayoutChange = (width, height) => {
        applyHostLayout(width, height).catch((error) => {
            setStatus(`Layout failed: ${error.message || error}`, "warn");
        });
    };
    window.h5gg_onButtonClick = () => {
        setPanelVisible(panel.hidden).catch(() => {});
    };

    async function setupHost() {
        resizeCanvas();
        if (!window.h5gg || !hasWindowControls()) {
            hideButton.disabled = true;
            setStatus("Browser preview: H5GG window controls are unavailable.", "warn");
            return;
        }

        try {
            if (!await h5gg.require(8.0)) {
                setStatus("H5GG 8.0 or newer is required.", "warn");
                return;
            }
            await setWindowDrag(0, 0, 0, 0);
            await setButtonAction();
            await setLayoutAction();
            await updateTouchRegion();
            setStatus("H5GG overlay ready. The floating button restores hidden controls.", "good");
        } catch (error) {
            setStatus(`H5GG setup failed: ${error.message || error}`, "warn");
        }
    }

    document.querySelector("#start-button").addEventListener("click", () => {
        state.drawing = true;
        state.lastFrame = performance.now();
        setStatus("Drawing started at a capped 30 FPS.", "good");
    });
    document.querySelector("#stop-button").addEventListener("click", () => {
        state.drawing = false;
        drawFrame();
        setStatus("Drawing stopped. The canvas is clear.");
    });
    hideButton.addEventListener("click", () => {
        setPanelVisible(false).catch(() => {});
    });
    window.addEventListener("resize", () => {
        resizeCanvas();
        updateTouchRegion().catch(() => {});
    });

    animationLoop(performance.now());
    setupHost();
})();
</script>
</body>
</html>
