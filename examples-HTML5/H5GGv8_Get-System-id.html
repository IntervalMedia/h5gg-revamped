<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <title>get-unique-system-id</title>
</head>

<body>
  <script>
    // Initialize the agent at application startup.
    const fpPromise = import('https://openfpcdn.io/fingerprintjs/v3')
      .then(FingerprintJS => FingerprintJS.load())

    async function showToast(msg) {
      const toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
      toast.style.color = 'white';
      toast.style.padding = '10px 20px';
      toast.style.borderRadius = '5px';
      toast.style.zIndex = '1000';
      document.body.appendChild(toast);

      setTimeout(() => {
        document.body.removeChild(toast);
      }, 5000);
    }

    (async function () {
      // Get the visitor identifier when you need it.
      fpPromise
        .then(fp => fp.get())
        .then(async result => {
          // This is the visitor identifier:
          const visitorId = result.visitorId;
          if (visitorId) {
            console.log(`The visitor ID is: ${visitorId}`);
          }
          await showToast(`The visitor ID is: ${visitorId}`)
        })
    })();
  </script>
  UUID? Check the source code of this page to see how to get the unique system ID using FingerprintJS.
</body>

</html>
