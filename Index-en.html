<!--CSS外观样式表-->
<style>

    --safe-top: env(safe-area-inset-top, 0px);

    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --ios-control-font-size: 16px;

    --input-bg: rgba(0,0,0,0);
    --border-color: #686868F0;
    --radio-checked-bg: #E8E8E8;
    --scrollbar-bg: #F5F5F5;
    --scrollbar-thumb: #B8B8B8;
    --title-bg: #D1D1D1;
    --popup-bg: #FDFDFD;
    --menubox-bg: #E8E8E890;
    --menubox-current-bg: #848484;
    --menubox-current-text: #E8E8E8;
    --result-border: #D1D1D1;
    --result-font: #848484;
    --slider-track-bg: #68686830;
    --slider-track-border: #010101;
    --slider-thumb-bg: #EEEEEEE0;
    --slider-thumb-border: #000000;
    --border-light: #B8B8B880;
    --checkbox-border: #686868;
    --checkbox-checked-border: #B8B8B8;
    --radio-border-color: #000000;
    --radio-dot-color: #000000;
}

:root.dark {
    --bg-color: rgba(30,30,30,0.95);
    --text-color: #E8E8E8;
    --btn-bg: #48484880;
    --btn-hover: #686868;
    --input-bg: rgba(255,255,255,0.1);
    --border-color: #888888F0;
    --radio-checked-bg: #484848;
    --scrollbar-bg: #2A2A2A;
    --scrollbar-thumb: #686868;
    --title-bg: #3A3A3A;
    --popup-bg: #3A3A3A;
    --menubox-bg: #48484890;
    --menubox-current-bg: #686868;
    --menubox-current-text: #D0D0D0;
    --result-border: #484848;
    --result-font: #A0A0A0;
    --slider-track-bg: #48484850;
    --slider-track-border: #686868;
    --slider-thumb-bg: #888888E0;
    --slider-thumb-border: #CCC;
    --border-light: #68686880;
    --checkbox-border: #888888;
    --checkbox-checked-border: #888888;
    --radio-border-color: #D0D0D0;

}

:root.light {
    --bg-color: rgba(255,255,255,0.8);
    --text-color: #000;
    --btn-bg: #84848450;
    --btn-hover: #fff;
    --input-bg: rgba(0,0,0,0);
    --border-color: #686868F0;
    --radio-checked-bg: #E8E8E8;
    --scrollbar-bg: #F5F5F5;
    --scrollbar-thumb: #B8B8B8;
    --title-bg: #D1D1D1;
    --popup-bg: #FDFDFD;
    --menubox-bg: #E8E8E890;
    --menubox-current-bg: #848484;
    --menubox-current-text: #E8E8E8;
    --result-border: #D1D1D1;
    --result-font: #848484;
    --slider-track-bg: #68686830;
    --slider-track-border: #010101;
    --slider-thumb-bg: #EEEEEEE0;
    --slider-thumb-border: #000000;
    --border-light: #B8B8B880;

@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: rgba(30,30,30,0.95);
        --text-color: #E8E8E8;
        --btn-bg: #48484880;
        --btn-hover: #686868;
        --input-bg: rgba(255,255,255,0.1);
        --border-color: #888888F0;
        --radio-checked-bg: #484848;
        --scrollbar-bg: #2A2A2A;
        --scrollbar-thumb: #686868;
        --title-bg: #3A3A3A;
        --popup-bg: #3A3A3A;
        --menubox-bg: #48484890;
        --menubox-current-bg: #686868;
        --menubox-current-text: #D0D0D0;
        --result-border: #484848;
        --result-font: #A0A0A0;
        --slider-track-bg: #48484850;
        --slider-track-border: #686868;
        --slider-thumb-bg: #888888E0;

    }
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background-color: var(--bg-color);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}
* {
    box-sizing: border-box;
    /*默认文字颜色*/
    color: var(--text-color);
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    
   -webkit-tap-highlight-color: transparent;
   outline: none;
    
    /*默认布局边框:灰色虚线, 开启这个方便查看布局*/
    /*/
     border: 1px dashed gray;/**/
    
}

*:not(input,checkbox,textarea) {
    /*禁止文本选择*/
   -webkit-touch-callout: none;
   -webkit-user-select: none;
   user-select: none; /* Non-prefixed version, currently */
}

input {
    background-color: var(--input-bg);
    height: 34px;
    min-width: 0;
    border: 1px solid var(--border-color);
    border-radius: 5px;
    padding: 0 8px;
}

button {
    min-height: 34px;
    color: #3393EF;
    background-color: var(--btn-bg);
    display: inline-block;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    outline: none;
    border: none;
    border-radius: 5px;
    padding: 0 6px;
    margin: 2px;
}

button:active {
    background-color: var(--btn-hover);
    transform: translateY(2px);
}

input[type=radio]  {
    width:16px;
    height:16px;
    margin:6px 2px;
    margin-right:6px;
    vertical-align:middle;
    -webkit-appearance:none;
    appearance:none;
    border:1px solid var(--radio-border-color);
    border-radius:50%;
    background-color:transparent;
    display:inline-grid;
    place-content:center;
}
input[type=radio]::before {
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--radio-dot-color);
    transform:scale(0);
}
input[type=radio]:checked::before {
    transform:scale(1);
}
    
input[type=checkbox]{
 visibility: hidden;
 vertical-align:middle; margin-bottom:2px;
 cursor: pointer;
 position: relative;
 width: 24px;
 height: 24px;
}
input[type=checkbox]::after{
 position: absolute;
 top: 0;
 margin-top:2px;
 width: 14px; height: 14px;
 border: 1px solid var(--checkbox-border);
 border-radius: 3px;
 background-color: var(--input-bg);
 display: inline-block;
 visibility: visible;
 text-align: center;
 content: ' ';
}
input[type=checkbox]:checked::after{
 content: "✓";
 color: #FFF;
 border-color: var(--checkbox-checked-border);
 background-color: #4498F7;
 font-size: 12px;
 font-weight: bold;
}

input[type=range] {
  -webkit-appearance: none;
}
input[type=range]:focus {
  outline: none;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 15px;
  cursor: pointer;
  animate: 0.2s;
  background: var(--slider-track-bg);
  border-radius: 1.3px;
  border: 0.2px solid var(--slider-track-border);
}
input[type=range]::-webkit-slider-thumb {
  border: 1px solid var(--slider-thumb-border);
  height: 18px;
  width: 16px;
  border-radius: 3px;
  background: var(--slider-thumb-bg);
  cursor: pointer;
  -webkit-appearance: none;
  margin-top: -2px;
}
input[type=range]:focus::-webkit-slider-runnable-track {
  background: #367ebd;
}

.menubox {
    display: inline;
    padding: 5px;
    width: 300px;
    height: 20px;
    line-height: 20px; /*height和line-height设置一样即可文字垂直居中*/
    text-align:center;
    background-color: var(--menubox-bg);
    border-radius: 5px;
}
.menubox.current {
    color: var(--menubox-current-text);
    background-color: var(--menubox-current-bg);
}

.menuview {
    display:none;
}

.menuview.current {
    display:block;
    overflow-x: hidden;
    overflow-y: auto;
}
    
/* 滚动条整体部分 */
.scrollbar {
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.scrollbar::-webkit-scrollbar {
    width: 5px; /* 纵向滚动条宽度 */
    height: 5px;/* 横向滚动条高度 */
    background-color: var(--scrollbar-bg); /* 滚动条整体背景，一般被覆盖着 */
}
/* 滚动条的轨道（里面装有Thumb） */
.scrollbar::-webkit-scrollbar-track {
    -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.3); /* 滚动条轨道阴影 */
    /*border-radius: 10px; /* 滚动条轨道圆角 */
    background-color: var(--scrollbar-bg); /* 滚动条轨道背景 */
}
/* 滚动条里面的滑块 */
.scrollbar::-webkit-scrollbar-thumb {
    border-radius: 15px; /* 滚动条滑块圆角 */
    -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,.3); /* 滚动条滑块阴影 */
    background-color: var(--scrollbar-thumb); /* 滚动条滑块颜色 */
}

.popup_container {
    position:absolute;
    z-index: 1000;
    left:50%;
    top:0;
}
    
#popup_search_edit {
    display:none;
    text-align: center;
    background-color: var(--popup-bg);
    width:200px;
    /* height:150px; */
    position:absolute;
    left:-100px; top:50px;
    border:1px solid var(--border-light);
    border-radius: 5px;
    padding: 1px;
}
    
#popup_progress {
    display:none;
    text-align: center;
    background-color: var(--popup-bg);
    width:200px;
    height:20px;
    position:absolute;
    left:-100px; top:100px;
    border:1px solid var(--border-light);
    border-radius: 5px;
    padding: 10px;
    z-index: 2000;
}
    
#popup_loadscripts {
    display:none;
    text-align: center;
    background-color: var(--popup-bg);
    width:250px;
    height:220px;
    position:absolute;
    left:-125px; top:20px;
    border:1px solid var(--border-light);
    border-radius: 5px;
    padding: 10px;
}

#popup_proclist {
    display:none;
    text-align: center;
    background-color: var(--popup-bg);
    width:180px;
    max-height:200px;
    position:absolute;
    left:-90px; top:50px;
    border:1px solid var(--border-light);
    border-radius: 5px;
    padding: 10px;
}

#popup_proclist button {
    display: block;
    width: 100%;
    height: 30px;
    border-radius: 2px;
    font-weight:bold;
    color: var(--text-color);
    text-align: left;
    background-color: #00000005;
}

table.datatype {
    border: 1px solid red;
    border-radius: 2px;
    border-collapse: collapse;
    border-style:hidden;
    box-shadow: 0 0 0 1px #3393EF;
}

.datatype td {
    cursor: hand;
    padding: 5px;
    color: #3393EF;
    border: 1px solid #3393EF;
    width: 22px;
    height: 15px;
    text-align: center;
}

.datatype td.selected {
    color: white;
    background-color: #3393EF;
}

.maskview {
    display: none;
    position: absolute;
    left: 0px;
    top: 0px;
    width: 100%;
    height: 100%;
    filter: alpha(opacity=60);
    background-color: #777;
    z-index: 1;
    opacity:0.5;
}

#listdiv {
    display:block;
    flex: 1;
    min-height: 0;
    overflow-x:hidden;
    overflow-y:scroll;
    height:auto;
    padding: 0;
}

#resultList tr.hilight td{
    color: #3393EF;
}

#resultList td {
    border-bottom:solid 1px var(--result-border);
}
#resultList td font {
    font-size:12px;color: var(--result-font);
}

#theme-toggle {
    float:right;
    font-size:14px;
    line-height:14px;
    cursor:pointer;
    padding:0 4px;
    user-select:none;
    -webkit-user-select:none;
}

.control-separator {
    border: none;
    border-top: 1px solid var(--result-border);
    margin: 6px 0;
}

#titleBar {
    height: 38px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background-color: var(--title-bg);
    border-bottom: 1px solid var(--result-border);
    cursor: move;
}

.title-brand {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.title-actions {
    display: flex;
    align-items: center;
    gap: 4px;
}

.title-action {
    min-height: 30px;
    height: 30px;
    margin: 0;
    padding: 0 9px;
    background: transparent;
    color: var(--text-color);
}

#appShell {
    height: calc(100% - 38px);
    display: grid;
    grid-template-columns: minmax(230px, 42%) minmax(0, 1fr);
    min-height: 0;
}

#appShell.controls-collapsed {
    grid-template-columns: 0 minmax(0, 1fr);
}

#controlsPanel {
    min-width: 0;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 0px;
    border-right: 1px solid var(--result-border);
    transition: opacity 120ms ease;
}

#appShell.controls-collapsed #controlsPanel {
    padding: 0;
    border: 0;
    opacity: 0;
    pointer-events: none;
}

.control-section {
    margin: 0 0 10px;
    padding: 10px;
    border: 1px solid var(--result-border);
    border-radius: 8px;
    background: rgba(127,127,127,0.05);
}

.section-title,
.control-section > summary {
    display: block;
    margin: 0 0 8px;
    font-weight: bold;
    color: #3393EF;
}

.control-section > summary {
    cursor: pointer;
    min-height: 28px;
    line-height: 28px;
}

.field-grid {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 7px 8px;
    align-items: center;
}

.field-grid label {
    color: var(--result-font);
}

.radio-row,
.inline-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
}

.radio-row label {
    display: flex;
    align-items: center;
    min-height: 34px;
}

.action-grid,
.tool-grid,
.sort-grid {
    display: grid;
    gap: 6px;
}

.action-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.tool-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.action-grid button,
.tool-grid button,
.sort-grid button {
    width: 100%;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}

.primary-action {
    color: white;
    background: #2F7DCD;
    font-weight: bold;
}

.compact-input {
    width: 100%;
}

.inline-row > input,
.inline-row > select {
    flex: 1;
    min-width: 0;
}

.inline-row > button {
    flex: 0 0 auto;
}

#resultsPanel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#resultsToolbar {
    flex: 0 0 auto;
    padding: 8px 10px;
    border-bottom: 1px solid var(--result-border);
    background: rgba(127,127,127,0.05);
}

.results-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 26px;
    margin-bottom: 6px;
}

#results_count {
    display: none;
    margin: 0;
    font-weight: bold;
}

.filter-row {
    display: flex;
    align-items: center;
    gap: 6px;
}

#filterInput {
    flex: 1;
    width: 100%;
}

.sort-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-top: 6px;
}

.sort-grid button {
    min-height: 30px;
    height: 30px;
    padding: 0 3px;
    font-size: 11px;
}

.empty-state {
    padding: 24px 12px;
    text-align: center;
    color: var(--result-font);
}

#listdiv > div[data-addr] {
    min-height: 54px;
}

.result-row {
    position: relative;
    min-height: 62px;
    padding: 10px 76px 10px 12px;
    border-bottom: 1px solid var(--result-border);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
}

.result-row:active,
.result-row.selected {
    background: rgba(10,132,255,0.16);
}

.result-address {
    color: var(--result-font);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.35;
    word-break: break-all;
}

.result-value {
    margin-top: 3px;
    color: #0A84FF;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.25;
    word-break: break-all;
}

.result-row-actions {
    position: absolute;
    top: 50%;
    right: 8px;
    display: flex;
    transform: translateY(-50%);
}

.result-icon-button {
    width: 32px;
    min-height: 36px;
    margin: 0;
    padding: 0;
    background: transparent;
    font-size: 18px;
}

@media (max-width: 520px) {
    #appShell {
        grid-template-columns: minmax(210px, 58%) minmax(0, 1fr);
    }

    .action-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

.frozen td { color: #93C5FD !important; }
.frozen-badge { display: none; font-size: 10px; margin-left: 4px; color: #60A5FA; }
.frozen .frozen-badge { display: inline; }

#uiTopLayer {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    pointer-events: none;
}

#uiToast {
    position: absolute;
    left: 50%;
    bottom: max(24px, calc(var(--safe-bottom) + 12px));
    transform: translateX(-50%);
    background: rgba(0,0,0,0.82);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    line-height: 1.3;
    max-width: min(90vw, 520px);
    text-align: center;
    opacity: 0;
    transition: opacity 0.22s ease;
}

#uiAlertMask {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.45);
    pointer-events: auto;
}

#uiAlertCard {
    width: min(88vw, 360px);
    border-radius: 12px;
    background: var(--popup-bg);
    border: 1px solid var(--border-light);
    box-shadow: 0 10px 36px rgba(0,0,0,0.3);
    overflow: hidden;
}

#uiAlertBody {
    padding: 14px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: center;
    font-size: 13px;
}

#uiAlertActions {
    border-top: 1px solid var(--result-border);
    padding: 8px;
    display: flex;
    justify-content: center;
}

#uiAlertOk {
    min-width: 96px;
}

#uiResultActionMask {
    position: absolute;
    inset: 0;
    display: none;
    align-items: flex-end;
    padding: 8px 8px max(8px, var(--safe-bottom));
    background: rgba(0,0,0,0.42);
    pointer-events: auto;
}

#uiResultActionSheet {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

.ui-result-action-group {
    overflow: hidden;
    border: 1px solid var(--border-light);
    border-radius: 14px;
    background: var(--popup-bg);
    box-shadow: 0 12px 36px rgba(0,0,0,0.32);
}

#uiResultActionTitle {
    padding: 12px 14px 9px;
    color: var(--result-font);
    font-size: 12px;
    line-height: 1.35;
    text-align: center;
    word-break: break-all;
}

.ui-result-action {
    width: 100%;
    min-height: 50px;
    margin: 0;
    border-top: 1px solid var(--result-border);
    border-radius: 0;
    background: transparent;
    color: #0A84FF;
    font-size: 17px;
}

#uiResultActionCancel {
    width: 100%;
    min-height: 50px;
    margin: 8px 0 0;
    border: 1px solid var(--border-light);
    border-radius: 14px;
    background: var(--popup-bg);
    color: #0A84FF;
    font-size: 17px;
    font-weight: 600;
}

/* iOS/iPadOS WKWebView tuning */
@supports (-webkit-touch-callout: none) {
    html,
    body {
        min-height: -webkit-fill-available;
    }

    body {
        padding-top: var(--safe-top);
        padding-right: var(--safe-right);
        padding-bottom: var(--safe-bottom);
        padding-left: var(--safe-left);
        overscroll-behavior: none;
    }

    #appShell {
        height: calc(100dvh - 38px - var(--safe-top) - var(--safe-bottom));
    }

    input,
    select,
    textarea,
    button {
        font-size: var(--ios-control-font-size);
    }

    input,
    textarea,
    select {
        -webkit-user-select: text;
        user-select: text;
    }

    .scrollbar,
    #controlsPanel,
    #listdiv,
    .menuview.current {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
    }

function h5ggType(type)
{
    if($("input:radio[name=numtype]:checked").val()=="unsigned") {
        switch(type) {
            case "I8":
                return "U8";
            case "I16":
                return "U16";
            case "I32":
                return "U32";
            case "I64":
                return "U64";
        }
    }
    
    return type;
}

    
//页面显示完毕事件
document.addEventListener("DOMContentLoaded", function(){

    if(typeof $ == 'undefined') {
        alert("jquery load failed!");

    }

    document.body.onselectstart = document.body.ondrag = function(){

    $("input").blur(function(){

    });
    
    //激活webkit的button:active
    document.body.addEventListener('touchstart', function () {});
    
    //绑定菜单点击切换子页面
    $("div.menubox").unbind('click').click(function(){
        $("div.menubox").removeClass("current");
        $("div.menuview").removeClass("current");
        $(this).addClass("current");
        
        var menuid = $(this).attr("menu");
        $("div#"+menuid).addClass("current");
    });
    
    $("#datavalue").focus(function(){
        var input = $(this);
        input.attr("type","number");
        setTimeout(function(){
            input.attr("type","text");
        }, 500);
    });
    
    
    $("#crossproc").click(function() {
        $("#popup_proclist").show();
        $("#maskview").show();
    });
        
    if(typeof h5gg!='undefined')
    {
        
        $("#version").text(h5gg_internel_version);
        
        //清除设计演示的结果列表
        onClickClearResults();
    
        //设置标题栏区域可拖动悬浮窗
        setWindowDrag(0, 0, 400, 80);
        
        //布局调整函数
        setLayoutAction(function(w,h) {
            var width = 370; var height = 370; //默认尺寸
            if(w<h) {
                height = 600; //竖屏模式加大显示高度
            }
            width = Math.min(width, w); //适配iPad浮窗, 最大宽度不超出
            height = Math.min(height, h); //适配老设备, 最大高度不超出
            var x = (w-width)/2;
            var y = (h-height)/2;
            if(w<h) {
                y = Math.max(20, y);
                height = Math.min(height, h-y);
            }
            setWindowRect(x,y,width,height);
        });

        var checkprocs = async function()
        {
            var procs = await h5gg.getProcList();
            if(procs)  //不为空(null)说明是具有跨进程权限
            {
                refreshProcList(procs);
                $("#crossproc").show();
                $("#closeMenu").hide();
                
                if(!$("#procname").attr('pid')) {
                    $("#popup_proclist").show();
                    $("#maskview").show();
                    $("#procname").text('');
                }
                
                setInterval(async function(){
                    if($("#popup_proclist").is(":visible"))
                        refreshProcList(await h5gg.getProcList());

                    if($("#procname").attr('pid'))
                    {
                        var targetStatus = await h5gg.getTargetStatus();
                        var alive = targetStatus && targetStatus.available;
                        
                        if(!alive) {
                            alert("Target process terminated\n\nPlease click on the title bar to select a new target");
                            $("#procname").removeAttr('pid');
                            $("#procname").text('');
                        }
                    }
                    
                }, 1500);
                
            } else  {
                $("#crossproc").hide();
            }
            
        }; //end of checkprocs
        
        checkprocs();
        //setInterval(checkprocs, 1500);
        checkAutorun();
    
    } //end of h5gg check
    
    //点击结果列表里面的地址时弹出修改窗口, 要在listdiv刷新html之后绑定
    $("table#resultList").on('click','tr', async function()
    {

        $(this).addClass("hilight");
        
        var address = $(this).attr("address");
        var datatype = $(this).attr("datatype");
        var datavalue = $(this).attr("datavalue");
        
        //读取该地址最新数据
        if(typeof h5gg!='undefined')
            datavalue = await h5gg.getValue(address, h5ggType(datatype));
        
        showPopView("&nbsp;&nbsp;Edit&nbsp;&nbsp;", async function(type, value){
            
            if(!await h5gg.setValue(address, value, h5ggType(type))) {
                alert("The modification failed, the address may be invalid!");
            }
            
            await onClickRefreshResults();
            
        }, datatype, datavalue);
    });
});

function refreshProcList(procs)
{
    $("#proctable button").remove();
    
    for(var i=0; i<procs.length; i++) {
        var proc = procs[i];
        var btn = $("<button>"+proc.name+"</button>");
        btn.attr("pid", proc.pid);
        btn.click(async function()
        {
            if(!await h5gg.setTargetProc($(this).attr('pid'))) {
                alert("Cannot Select Target!");
                return;
            }
            
            onClickClearResults();
            
            $("#procname").attr('pid', $(this).attr('pid'));
            $("#procname").text($(this).text());
            $("#popup_proclist").hide();
            $("#maskview").hide();
        });
        
        $("#proctable").append(btn);
    }
}

function onClickLoadScript(url, type)
{
    if(!url) return;
    
    if(/^\w+\:/.test(url)==false) url = "file://"+url;
    
    try{
        url = new URL(url);
        url.searchParams.append("_", Math.random());
    }catch(e){
        alert("invliad URL!");
        return;
    }
    
    $("#popup_progress").show();
    $("#maskview_script").show();
    
    if(type=='h5' || (!type&&!/\.js$/.test(url.pathname))) {
        window.location = url.href;
        return;
    }
    
    var script = document.createElement("script");

    script.type = "text/javascript";
    
    script.onload = function () {
      alert("JS Run Complete!");
        $("#popup_progress").hide();
        $("#maskview_script").hide();
    };
    
    script.onerror = function () {
        alert("Load Error!\nURL Invalid or Network Exception!");
        $("#popup_progress").hide();
        $("#maskview_script").hide();
    };

    script.src = url.href;
    document.body.appendChild(script);
}


//弹出搜索或修改窗口
function showPopView(name, action, type, value)
{
    $("#maskview").show();
    $("#popup_search_edit").show();
        $("#popup_search_edit").find("#popupTitle").html(name);
    $("#popup_search_edit").find("button#action").html(name);
    
    if(type) {
        $("table#datatype td").each(function(){
            if($(this).text()==type)
                $(this).addClass("selected");
            else
                $(this).removeClass("selected");
        });
    }
    
    if(value) {
        $("input#datavalue").val(value);
    }
    
    $("input#datavalue").focus();
    
    $("#popup_search_edit").find("button#action").unbind("click").click(function(){
        var type = $("table#datatype td.selected").text();
        var value = $("input#datavalue").val();
        
        $("#popup_search_edit").hide();
        $("#popup_progress").show();
        
        setTimeout(function() {
            
            action(type, value);
            
            $("#popup_progress").hide();
            $("#maskview").hide();
        }, 200);
        
    });
    
    $("#popup_search_edit").find("button#cancel").unbind("click").click(function(){
        $("#maskview").hide();
        $("#popup_search_edit").hide();
    });
    
    $("table#datatype td").unbind("click").click(function(){
        $("table#datatype td").removeClass("selected");
        $(this).addClass("selected");
        $("input#datavalue").focus();
    });
}

async function loadResults(from, count)
{
    console.log('FUNC loadResults');
    var results = await h5gg.getResults(count, from);
    
    for(var i=0; i<results.length; i++)
    {
        if(results[i].type=='F32' || results[i].type=='F64')
            results[i].value = '('+results[i].value+')';
    }
    if(from == 0) {
        gAllResults = results;
        cacheResults(gAllResults);
        renderResults(gAllResults);
    } else {
        gAllResults = gAllResults.concat(results);
        renderResults(gAllResults);
    }
}

function escapeScriptText(value) {
    return String(value).replace(/[&<>"']/g, function(character) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
    });
}

async function loadScript(name) {
    if(typeof h5gg == 'undefined' || !h5gg.loadScript) {
        showToast('Script API is unavailable in this environment');
        return;
    }

    var content = null;
    try {
        content = await h5gg.loadScript(name);
    } catch(error) {
        console.error('loadScript failed:', error);
    }

    var input = document.getElementById('scriptFileName');
    var editor = document.getElementById('scriptEditor');
    if(input) input.value = name;
    if(editor && content !== null) editor.value = content;
    if(content === null) {
        var err = null;
        try {
            if(h5gg.getLastFileError) err = await h5gg.getLastFileError();
        } catch(_) {}
        showToast(err || 'Unable to load script');
    }
}

async function addPtrStep() {
    console.log('FUNC addPtrStep');
    if(gPointerChain.length > 32) {
        showToast('Pointer chains are limited to 32 reads');
        return;
    }
    if(gPointerChain.length == 0) {
        var base = document.getElementById('ptrBase').value.trim();
        if(!base) return;
        gPointerChain.push(base);
    }
    
    var off = document.getElementById('ptrOffset').value.trim();
    if(!off) return;
    
    var currentAddr = gPointerChain[gPointerChain.length - 1];
    var target;
    try {
        var offset = off.startsWith('-0x') ? -BigInt('0x'+off.substring(3)) : BigInt(off);
        target = BigInt(currentAddr) + offset;
        if(target < 0n || target > 0xFFFFFFFFFFFFFFFFn) throw new Error('range');
    } catch(error) {
        showToast('Invalid pointer address or offset');
        return;
    }
    var targetAddr = '0x' + target.toString(16).toUpperCase();
    
    var value = await h5gg.readPointer(targetAddr);
    
    var display = document.getElementById('ptrChainDisplay');
    if(display) {
        var line = document.createElement('div');
        line.style.padding = '4px';
        line.style.borderBottom = '1px solid var(--border-color,#eee)';
        line.innerHTML = '['+gPointerChain.length+'] <span style="color:#3393EF">'+targetAddr+'</span> + '+off+' = <b>'+value+'</b>';
        display.appendChild(line);
    }
    
    if(!value) {
        showToast('Pointer read failed');
        return;
    }
    gPointerChain.push(value);
    document.getElementById('ptrOffset').value = '';
    document.getElementById('ptrOffset').focus();
}

async function doDump() {
    console.log('FUNC doDump');
    var start = document.getElementById('dumpStart').value.trim();
    var end = document.getElementById('dumpEnd').value.trim();
    var name = document.getElementById('dumpName').value.trim();
    if(!start || !end || !name) return;
    var status = document.getElementById('dumpStatus');
    if(status) status.textContent = 'Dumping... 0%';
    var poll = setInterval(async function() {
        var current = await h5gg.getDumpStatus();
        if(status && current && current.state == 'running') {
            status.textContent = 'Dumping... ' + Math.floor((current.progress || 0) * 100) + '%';
        }
    }, 250);
    try {
        var ok = await h5gg.dumpMemory(start, end, name);
        var finalStatus = await h5gg.getDumpStatus();
        if(status) status.textContent = ok ? 'Saved to Documents/'+name :
            (finalStatus.state == 'cancelled' ? 'Dump cancelled' :
             'Dump failed' + (finalStatus.error ? ': ' + finalStatus.error : ''));
        if(ok) setTimeout(function(){ closeOverlay('dumpOverlay'); }, 1500);
    } catch(error) {
        if(status) status.textContent = 'Dump failed: ' + error;
    } finally {
        clearInterval(poll);
    }
}

    }

    if(!ok) {
        status.textContent = 'Value write failed';
        status.style.color = 'red';
        return;
    }

    var newVal = await h5gg.getValue(addr, h5ggType(type));
    status.textContent = 'Value written successfully';
    status.style.color = 'green';

    var rows = document.querySelectorAll('[data-addr="' + addr + '"]');
    if(rows.length > 0) {
        var row = rows[0];
        var valEl = row.querySelector('.result-value');
        if(valEl) valEl.textContent = newVal;
    }
}

async function writeMemoryEditor(addr, type, bytes) {
    console.log('FUNC writeMemoryEditor');
    var input = document.getElementById('memEditorInput');
    if(!input) return;
    var hexStr = input.value.trim();
    var parts = hexStr.split(/\s+/);
    var status = document.getElementById('memEditorStatus');
    if(!status) return;
    for(var i = 0; i < parts.length; i++) {
        if(!/^[0-9a-fA-F]{2}$/.test(parts[i])) {
            status.textContent = 'Invalid hex at position ' + (i+1);
            status.style.color = 'red';
            return;
        }
    }
    var success = 0;
    for(var i = 0; i < parts.length; i++) {
        var val = parseInt(parts[i], 16);
        var ok = await h5gg.setValue(Number(addr) + i + '', val + '', 'U8');
        if(ok) success++;
    }
    if(success == parts.length) {
        status.textContent = 'Written ' + success + ' bytes successfully';
        status.style.color = 'green';
    } else {
        status.textContent = 'Wrote ' + success + '/' + parts.length + ' bytes';
        status.style.color = 'orange';
    }
    if(success > 0) {
        var newVal = await h5gg.getValue(addr, type);
        var rows = document.querySelectorAll('[data-addr="' + addr + '"]');
        if(rows.length > 0) {
            var row = rows[0];
            var valEl = row.querySelector('.result-value');
            if(valEl) valEl.textContent = newVal;
        }
    }
}

function sortResults(mode) {
    console.log('FUNC sortResults');
    if(!gAllResults || gAllResults.length == 0) return;
    gAllResults.sort(function(a, b) {
        var aAddr = parseInt(a.address, 16);
        var bAddr = parseInt(b.address, 16);
        if(mode == 'addr') return aAddr - bAddr;
        if(mode == 'addrD') return bAddr - aAddr;
        var aVal = parseFloat(a.value);
        var bVal = parseFloat(b.value);
        if(isNaN(aVal)) aVal = 0;
        if(isNaN(bVal)) bVal = 0;
        if(mode == 'val') return aVal - bVal;
        if(mode == 'valD') return bVal - aVal;
        return 0;
    });
    filterResults();
}

function showToast(msg) {
    gToastQueue.push({
        message: String(msg == null ? '' : msg),
        duration: 2000
    });
    processToastQueue();
}

var gToastQueue = [];
var gToastShowing = false;
var gAlertQueue = [];
var gAlertShowing = false;

function processToastQueue() {
    if(gToastShowing || !gToastQueue.length) return;

    var layer = ensureTopLayer();
    var el = layer.querySelector('#uiToast');
    var current = gToastQueue[0];

    gToastShowing = true;
    el.textContent = current.message;
    el.style.opacity = '1';

    clearTimeout(el._hideTimer);
    clearTimeout(el._nextTimer);

    el._hideTimer = setTimeout(function() {
        el.style.opacity = '0';
        el._nextTimer = setTimeout(function() {
            gToastQueue.shift();
            gToastShowing = false;
            processToastQueue();
        }, 240);
    }, current.duration);
}

function ensureTopLayer() {
    var layer = document.getElementById('uiTopLayer');
    if(layer) return layer;

    layer = document.createElement('div');
    layer.id = 'uiTopLayer';
    layer.innerHTML =
        '<div id="uiToast" aria-live="polite"></div>' +
        '<div id="uiAlertMask" role="dialog" aria-modal="true">' +
            '<div id="uiAlertCard">' +
                '<div id="uiAlertBody"></div>' +
                '<div id="uiAlertActions">' +
                    '<button id="uiAlertOk" type="button">OK</button>' +
                '</div>' +
            '</div>' +

                '</div>' +
                '<button id="uiResultActionCancel" type="button" onclick="dismissResultActions()">Cancel</button>' +
            '</div>' +
        '</div>';

    document.documentElement.appendChild(layer);

    var mask = layer.querySelector('#uiAlertMask');
    mask.addEventListener('click', function(event) {
        if(event.target === mask) {
            dismissActiveAlert();
        }
    });

    var resultMask = layer.querySelector('#uiResultActionMask');
    resultMask.addEventListener('click', function(event) {
        if(event.target === resultMask) dismissResultActions();
    });

    return layer;
}

function dismissActiveAlert() {
    var layer = ensureTopLayer();
    var mask = layer.querySelector('#uiAlertMask');
    if(mask.style.display !== 'flex') return;

    mask.style.display = 'none';
    gAlertShowing = false;
    if(gAlertQueue.length) gAlertQueue.shift();

    if(layer._alertKeydownHandler) {
        document.removeEventListener('keydown', layer._alertKeydownHandler);
        layer._alertKeydownHandler = null;
    }

    setTimeout(processAlertQueue, 0);
}

function processAlertQueue() {
    if(gAlertShowing || !gAlertQueue.length) return;

    var layer = ensureTopLayer();
    var mask = layer.querySelector('#uiAlertMask');
    var body = layer.querySelector('#uiAlertBody');
    var ok = layer.querySelector('#uiAlertOk');

    gAlertShowing = true;
    body.textContent = String(gAlertQueue[0]);
    mask.style.display = 'flex';

    ok.onclick = dismissActiveAlert;

    layer._alertKeydownHandler = function(event) {
        if(mask.style.display !== 'flex') return;
        if(event.key === 'Escape' || event.key === 'Enter') {
            event.preventDefault();
            dismissActiveAlert();
        }
    };

    document.addEventListener('keydown', layer._alertKeydownHandler);
    setTimeout(function() {
        try { ok.focus(); } catch(_) {}
    }, 0);
}

function showCustomAlert(message) {
    gAlertQueue.push(message == null ? '' : message);
    processAlertQueue();
}

window.alert = function(message) {

async function loadAutorunList() {
    var sel = document.getElementById('autorunSelect');
    if(!sel) return;
    var saved = localStorage.getItem('h5gg_autorun') || '';
    if(typeof h5gg == 'undefined' || !h5gg.listScripts) {
        sel.innerHTML = '<option value="">-- Auto-run --</option>';
        return;
    }

    var list = [];
    try {
        var loaded = await h5gg.listScripts();
        if(Array.isArray(loaded)) list = loaded;
    } catch(error) {
        console.error('loadAutorunList failed:', error);
    }

    sel.innerHTML = '<option value="">-- Auto-run --</option>';
    for(var i=0;i<list.length;i++) {
        if(!list[i].toLowerCase().endsWith('.js')) continue;
        var opt = document.createElement('option');
        opt.value = list[i];
        opt.textContent = list[i];
        if(list[i] == saved) opt.selected = true;
        sel.appendChild(opt);
    }
}

function runCurrentScript() {
    var filename = document.getElementById('scriptFileName').value;
    if(filename.toLowerCase().endsWith('.html')) {
        showToast('HTML files can be edited and saved, but only JavaScript files can run here');
        return;
    }
    runScript(document.getElementById('scriptEditor').value, filename);
}

function runScript(code, filename) {
    try {
        var sandbox = {
            console: console,
            setTimeout: setTimeout,
            clearTimeout: clearTimeout,
            setInterval: setInterval,
            clearInterval: clearInterval,
            alert: alert,
            confirm: confirm,
            prompt: prompt,
            h5gg: window.h5gg,
            Number: Number,
            String: String,
            Boolean: Boolean,
            Array: Array,
            Object: Object,
            Math: Math,
            JSON: JSON,
            parseInt: parseInt,
            parseFloat: parseFloat,
            isNaN: isNaN,
            Date: Date,
            RegExp: RegExp,
            Error: Error,
            Promise: Promise,
        };
        
        var argNames = Object.keys(sandbox);
        var argValues = argNames.map(function(k) { return sandbox[k]; });
        var fn = new Function(argNames.join(','), code);
        var result = fn.apply(null, argValues);
        
        if(result && typeof result.then === 'function') {
            result.catch(function(e) { showToast('Script error: ' + e.message); });
        }
        
        showToast('Script ran: ' + (filename || 'unnamed'));
        return true;
    } catch(e) {
        showToast('Script error: ' + e.message);
        console.error('Script error in', filename, ':', e);
        return false;
    }
}

async function checkAutorun() {
    console.log('FUNC checkAutorun');
    var name = localStorage.getItem('h5gg_autorun');
    if(!name) return;
    if(!name.toLowerCase().endsWith('.js')) {
        localStorage.removeItem('h5gg_autorun');
        return;
    }
    if(typeof h5gg == 'undefined' || !h5gg.loadScript) return;

    try {
        var content = await h5gg.loadScript(name);
        if(content) runScript(content, name);
    } catch(error) {
        console.error('checkAutorun failed:', error);
    }
}

var gViewerAddr = '0x0';

function openMemoryViewer() {
    console.log('FUNC openMemoryViewer');
    var html = '<div id="viewerOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999" onclick="closeOverlay(\'viewerOverlay\')">';

    html += '</div>';

    html += '<div style="display:flex;padding:6px 8px;border-bottom:1px solid var(--border-color,#eee);align-items:center;flex-shrink:0">';
    html += '<span style="font-size:12px;margin-right:4px">Address:</span>';
    html += '<input id="viewerAddr" type="text" value="'+gViewerAddr+'" style="flex:1;padding:4px;font-family:monospace;font-size:12px;background:var(--input-bg,transparent);border:1px solid var(--border-color,#ccc);border-radius:3px">';
    html += '<button onclick="viewerGo()" style="margin-left:4px;padding:4px 8px;font-size:12px">Go</button>';
    html += '</div>';

    html += '<div style="display:flex;padding:2px 8px;border-bottom:1px solid var(--border-color,#eee);flex-shrink:0">';
    html += '<button onclick="viewerPage(-1)" style="flex:1;font-size:11px;padding:4px;margin:2px">-Page</button>';
    html += '<button onclick="viewerStep(-16)" style="flex:1;font-size:11px;padding:4px;margin:2px">-16</button>';
    html += '<button onclick="viewerStep(-1)" style="flex:1;font-size:11px;padding:4px;margin:2px">-1</button>';
    html += '<button onclick="viewerStep(1)" style="flex:1;font-size:11px;padding:4px;margin:2px">+1</button>';
    html += '<button onclick="viewerStep(16)" style="flex:1;font-size:11px;padding:4px;margin:2px">+16</button>';
    html += '<button onclick="viewerPage(1)" style="flex:1;font-size:11px;padding:4px;margin:2px">+Page</button>';
    html += '</div>';

    html += '<div id="viewerDump" class="scrollbar" style="flex:1;overflow-y:auto;padding:8px;font-family:monospace;font-size:10px;line-height:1.6;white-space:pre"></div>';

    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);

    viewerGo();
}

async function viewerGo() {
    var input = document.getElementById('viewerAddr');
    if(!input) return;
    try {
        var address = BigInt(input.value.trim());
        if(address < 0n || address > 0xFFFFFFFFFFFFFFFFn) throw new Error('range');
        gViewerAddr = '0x' + address.toString(16).toUpperCase();
    } catch(error) {
        document.getElementById('viewerDump').textContent = 'Invalid address';
        return;
    }
    input.value = gViewerAddr;
    await viewerRefresh();
}

async function viewerRefresh() {
    console.log('FUNC viewerRefresh');
    var dump = document.getElementById('viewerDump');
    if(!dump || !gViewerAddr) return;

    var addr = BigInt(gViewerAddr);
    var page = await h5gg.readMemoryPage(gViewerAddr, 256);
    if(!page || page.error) { dump.textContent = 'Failed to read memory'; return; }

    var out = '';
    for(var line = 0; line < page.bytes.length; line += 16) {
        var offset = (addr + BigInt(line)).toString(16).toUpperCase().padStart(16, '0');
        var hex = '';
        var ascii = '';
        for(var column = 0; column < 16; column++) {
            var value = page.bytes[line + column];
            hex += value === null ? '?? ' : value.toString(16).toUpperCase().padStart(2, '0') + ' ';
            if(column == 7) hex += ' ';
            ascii += value === null ? '\u00b7' : (value >= 32 && value <= 126 ? String.fromCharCode(value) : '.');
        }
        out += offset + '  ' + hex + ' |' + ascii + '|\n';
    }
    if(!page.complete) out += '\nUnreadable bytes are shown as ??.';
    dump.textContent = out;
}

async function viewerStep(delta) {
    var addr = BigInt(gViewerAddr) + BigInt(delta);
    var maximum = 0xFFFFFFFFFFFFFFFFn - 255n;
    if(addr < 0n) addr = 0n;
    if(addr > maximum) addr = maximum;
    gViewerAddr = '0x' + addr.toString(16).toUpperCase();
    var input = document.getElementById('viewerAddr');
    if(input) input.value = gViewerAddr;
    await viewerRefresh();
}

async function viewerPage(dir) {
    await viewerStep(dir * 256);
}
